<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>客诉仪表盘 · 精艺达</title>
<style>
:root {
  --navy-deep:#050C16;--navy:#0A1628;--navy-mid:#0D1E38;--navy-light:#112642;--navy-surface:#15294A;
  --gold:#C8A45C;--gold-light:#D4B87A;--silver:#8B9CB8;--silver-light:#A8B8CC;--white:#FFF;
  --radius-xl:24px;--radius-lg:16px;--radius-md:10px;--radius-sm:6px;
  --accent-gradient:linear-gradient(135deg,#D4B87A,#C8A45C,#A07830);
  --font-cn:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  --font-en:-apple-system,'Segoe UI','Helvetica Neue',sans-serif;
  --font-serif:'Songti SC','STSong','SimSun',serif;
  --font-mono:'SF Mono','Menlo','Consolas',monospace;
  --shadow-lg:0 8px 32px rgba(5,12,22,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;background:var(--navy-deep);color:var(--silver);-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font-cn);background:radial-gradient(ellipse 60% 50% at 50% 30%,#0d1e38 0%,#050C16 100%);min-height:100vh}

/* Header */
header{position:sticky;top:0;z-index:100;background:rgba(10,22,40,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:0.5px solid rgba(255,255,255,0.06)}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;max-width:1200px;margin:0 auto}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--white);font-size:1rem}
.nav-brand span{font-family:var(--font-en);font-size:0.55rem;color:var(--gold);letter-spacing:0.1em;text-transform:uppercase}
.nav-actions{display:flex;gap:12px;align-items:center}
.nav-btn{padding:6px 16px;border-radius:20px;font-size:0.78rem;cursor:pointer;border:0.5px solid rgba(200,164,92,0.2);background:rgba(200,164,92,0.06);color:var(--gold);transition:all .3s;font-family:var(--font-cn);text-decoration:none}
.nav-btn:hover{background:rgba(200,164,92,0.15);border-color:var(--gold)}
.nav-btn.danger{border-color:rgba(231,76,60,0.25);color:#e74c3c}
.nav-btn.danger:hover{background:rgba(231,76,60,0.1)}

/* Content */
main{padding:24px;max-width:1200px;margin:0 auto}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.stat-card{text-align:center;padding:24px 16px;background:rgba(13,30,56,0.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(200,164,92,0.06);border-radius:var(--radius-lg)}
.stat-num{font-family:var(--font-serif);font-size:2rem;font-weight:900;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:0.78rem;color:var(--silver);margin-top:4px}

/* Filters */
.filter-bar{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filter-btn{padding:6px 18px;border-radius:20px;font-size:0.78rem;cursor:pointer;border:0.5px solid rgba(200,164,92,0.15);background:rgba(200,164,92,0.04);color:var(--silver);transition:all .25s;font-family:var(--font-cn)}
.filter-btn:hover,.filter-btn.active{background:rgba(200,164,92,0.15);border-color:var(--gold);color:var(--white)}

/* Groups */
.group{margin-bottom:32px}
.group-header{font-size:1.05rem;font-weight:600;color:var(--white);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(200,164,92,0.08);display:flex;justify-content:space-between}
.group-count{font-size:0.75rem;color:var(--silver);font-weight:400}

/* Cards */
.card{background:rgba(13,30,56,0.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(200,164,92,0.06);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px;transition:all .3s;cursor:pointer}
.card:hover{border-color:rgba(200,164,92,0.15);box-shadow:var(--shadow-lg)}
.card.expanded{border-color:rgba(200,164,92,0.25);box-shadow:0 0 0 2px rgba(200,164,92,0.08),var(--shadow-lg)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.card-top h4{font-size:0.95rem;color:var(--white);margin:0;display:flex;align-items:center;gap:8px}
.card-arrow{font-size:0.7rem;color:var(--gold);transition:transform .3s;display:inline-block}
.card.expanded .card-arrow{transform:rotate(180deg)}
.card-summary{font-size:0.8rem;color:var(--silver);margin-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:2px 10px;border-radius:10px;font-size:0.62rem;letter-spacing:0.05em;font-family:var(--font-en);text-transform:uppercase}
.badge-high{background:rgba(231,76,60,0.15);color:#e74c3c;border:0.5px solid rgba(231,76,60,0.25)}
.badge-medium{background:rgba(243,156,18,0.15);color:#f39c12;border:0.5px solid rgba(243,156,18,0.25)}
.badge-low{background:rgba(46,204,113,0.12);color:#2ecc71;border:0.5px solid rgba(46,204,113,0.2)}
.badge-cat{background:rgba(200,164,92,0.1);color:var(--gold);border:0.5px solid rgba(200,164,92,0.2)}
.card-meta{font-size:0.72rem;color:var(--silver);margin-bottom:6px;display:flex;gap:16px;flex-wrap:wrap}
.card-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.25,.46,.45,.94)}
.card.expanded .card-body{max-height:500px}
.card-detail{padding-top:12px;margin-top:12px;border-top:1px solid rgba(200,164,92,0.08)}
.card-detail-row{display:flex;gap:16px;margin-bottom:6px;font-size:0.78rem;flex-wrap:wrap}
.card-detail-row strong{color:var(--silver-light);min-width:60px}
.card-detail-row span{color:var(--white)}
.card-detail-desc{margin-top:8px;font-size:0.82rem;color:var(--silver);line-height:1.8;background:rgba(10,22,40,0.3);padding:12px;border-radius:var(--radius-sm)}

.empty{text-align:center;padding:80px 20px}
.empty svg{opacity:0.25;margin-bottom:20px}
.empty h3{color:var(--white);margin-bottom:8px}
.empty p{color:var(--silver);font-size:0.85rem}

@media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <nav>
    <div class="nav-brand">精艺达<span>Jingyida</span></div>
    <div class="nav-actions">
      <a href="https://gyt20110315.github.io/jingyida2026/" class="nav-btn">返回官网</a>
      <button class="nav-btn danger" onclick="clearAll()">清空数据</button>
      <button class="nav-btn" onclick="logout()">退出</button>
    </div>
  </nav>
</header>
<main>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="s-total">0</div><div class="stat-label">总客诉数</div></div>
    <div class="stat-card"><div class="stat-num" id="s-high">0</div><div class="stat-label">非常紧急</div></div>
    <div class="stat-card"><div class="stat-num" id="s-cust">0</div><div class="stat-label">涉及客户</div></div>
    <div class="stat-card"><div class="stat-num" id="s-today">0</div><div class="stat-label">今日新增</div></div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filter('all')">全部</button>
    <button class="filter-btn" onclick="filter('high')">非常紧急</button>
    <button class="filter-btn" onclick="filter('medium')">紧急</button>
    <button class="filter-btn" onclick="filter('low')">一般</button>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" stroke="#C8A45C" stroke-width="1"/><path d="M22 22h20v20H22z" stroke="#C8A45C" stroke-width="1"/></svg>
    <h3>暂无客诉记录</h3><p>客户提交的反馈将显示在这里</p>
  </div>
</main>

<script>
if(!sessionStorage.getItem('jya'))location.href='index.html';

var KEY='jy_complaints';
var catLabels={quality:'产品质量',delivery:'交付延迟',spec:'规格不符',damage:'运输损坏',service:'服务建议',other:'其他'};
var urgLabels={high:'非常紧急',medium:'紧急',low:'一般'};
var urgClass={high:'badge-high',medium:'badge-medium',low:'badge-low'};
var currentFilter='all';

function getData(){
  try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}
}

function filter(f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(function(b,i){
    b.classList.toggle('active',(f==='all'&&i===0)||(f==='high'&&i===1)||(f==='medium'&&i===2)||(f==='low'&&i===3));
  });
  render();
}

function render(){
  var data=getData();
  var filtered=currentFilter==='all'?data:data.filter(function(c){return c.urgency===currentFilter});

  var today=new Date().toDateString();
  document.getElementById('s-total').textContent=data.length;
  document.getElementById('s-high').textContent=data.filter(function(c){return c.urgency==='high'}).length;
  var custs={};data.forEach(function(c){custs[c.customer]=1});
  document.getElementById('s-cust').textContent=Object.keys(custs).length;
  document.getElementById('s-today').textContent=data.filter(function(c){return new Date(c.timestamp).toDateString()===today}).length;

  var empty=document.getElementById('empty');
  var list=document.getElementById('list');

  if(filtered.length===0){empty.style.display='block';list.innerHTML='';return}
  empty.style.display='none';

  var groups={};
  filtered.forEach(function(c){if(!groups[c.customer])groups[c.customer]=[];groups[c.customer].push(c)});

  var html='';
  Object.keys(groups).sort().forEach(function(cust){
    html+='<div class="group"><div class="group-header">'+cust+'<span class="group-count">'+groups[cust].length+' 条</span></div>';
    groups[cust].forEach(function(c){
      var d=new Date(c.timestamp);
      var ts=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      var summary=(c.description||'暂无描述').substring(0,60)+((c.description||'').length>60?'…':'');
      html+='<div class="card" onclick="this.classList.toggle(\'expanded\')">';
      html+='<div class="card-top"><h4><span class="card-arrow">▸</span> '+(c.contactPerson||'匿名')+'</h4><div class="badges"><span class="badge '+urgClass[c.urgency]+'">'+urgLabels[c.urgency]+'</span><span class="badge badge-cat">'+(catLabels[c.category]||c.category)+'</span></div></div>';
      html+='<div class="card-summary">'+summary+'</div>';
      html+='<div class="card-body"><div class="card-detail">';
      html+='<div class="card-detail-row"><strong>联系电话</strong><span>'+(c.phone||'未填写')+'</span></div>';
      html+='<div class="card-detail-row"><strong>订单编号</strong><span>'+(c.orderRef||'无')+'</span></div>';
      html+='<div class="card-detail-row"><strong>提交时间</strong><span>'+ts+'</span></div>';
      html+='<div class="card-detail-row"><strong>公司名称</strong><span>'+cust+'</span></div>';
      html+='<div class="card-detail-desc"><strong>问题描述：</strong><br>'+(c.description||'暂无描述')+'</div>';
      html+='</div></div></div>';
    });
    html+='</div>';
  });
  list.innerHTML=html;
}

function clearAll(){
  if(confirm('确定清空所有客诉数据？此操作不可撤销。')){localStorage.setItem(KEY,'[]');render()}
}
function logout(){sessionStorage.removeItem('jya');location.href='index.html'}

render();
</script>
</body>
</html>
